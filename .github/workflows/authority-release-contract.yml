name: authority-release-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controlled-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout observatory
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run observatory tests
        run: npm test

      - name: Preserve supporting T0 authority tests
        run: |
          set -euo pipefail
          mkdir -p out/release/gate-zero-client
          node --test \
            test/authority-core-v0.test.mjs \
            test/e1-transaction-gate-v0.test.mjs \
            test/e2-payload-gate-v0.test.mjs \
            test/warrant-issuer-trust-v0.test.mjs \
            | tee out/release/gate-zero-client/supporting-tests.tap

          grep -F "second reservation is rejected after TX_RESERVED consumption" out/release/gate-zero-client/supporting-tests.tap
          grep -F "A43 staged payload cannot be replaced or staged twice" out/release/gate-zero-client/supporting-tests.tap
          grep -F "A55 caller operational metadata is rejected" out/release/gate-zero-client/supporting-tests.tap
          grep -F "A5 untrusted Warrant issuer is rejected" out/release/gate-zero-client/supporting-tests.tap
          grep -F "external trust store rejects key id that does not match SPKI bytes" out/release/gate-zero-client/supporting-tests.tap

      - name: Build fixture Observation Pack
        run: |
          node bin/workflow-observatory.mjs discover             --input test/fixtures/browse.json             --query risk             --output-dir out/release/observation-pack

      - name: Freeze admitted fixture Request Identity
        env:
          REQUEST_JSON: '{"company":"Example"}'
          OFFERING_NAME: "Company Risk Analysis"
        run: |
          node scripts/freeze-request-identity.mjs             --raw out/release/observation-pack/raw.json             --normalized out/release/observation-pack/normalized.json             --manifest out/release/observation-pack/manifest.json             --offering "$OFFERING_NAME"             --output out/release/request-identity.json

      - name: Build admitted fixture Request Shadow
        env:
          REQUEST_JSON: '{"company":"Example"}'
          OFFERING_NAME: "Company Risk Analysis"
        run: |
          node scripts/build-shadow-request.mjs             --raw out/release/observation-pack/raw.json             --normalized out/release/observation-pack/normalized.json             --manifest out/release/observation-pack/manifest.json             --request-identity out/release/request-identity.json             --offering "$OFFERING_NAME"             --output out/release/request-shadow.json

      - name: Install pinned local EVM toolchain
        run: |
          set -euo pipefail
          FOUNDRY_DIR="${RUNNER_TEMP}/foundry-v1.8.5"
          FOUNDRY_ARCHIVE="${RUNNER_TEMP}/foundry_v1.8.5_linux_amd64.tar.gz"
          SOLC_BIN="${RUNNER_TEMP}/solc-0.8.30"
          mkdir -p "$FOUNDRY_DIR"

          curl -L --fail --retry 3 \
            -o "$FOUNDRY_ARCHIVE" \
            "https://github.com/foundry-rs/foundry/releases/download/v1.8.5/foundry_v1.8.5_linux_amd64.tar.gz"
          echo "6c66ffcc55fa4249197721baa3098bc208014ea1d8aa04b2ed50ac6bccffb226  $FOUNDRY_ARCHIVE" | sha256sum -c -
          tar -xzf "$FOUNDRY_ARCHIVE" -C "$FOUNDRY_DIR"
          echo "$FOUNDRY_DIR" >> "$GITHUB_PATH"
          echo "FOUNDRY_DIR=$FOUNDRY_DIR" >> "$GITHUB_ENV"

          curl -L --fail --retry 3 \
            -o "$SOLC_BIN" \
            "https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.30+commit.73712a01"
          echo "f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7  $SOLC_BIN" | sha256sum -c -
          chmod +x "$SOLC_BIN"
          echo "SOLC_BIN=$SOLC_BIN" >> "$GITHUB_ENV"
          echo "LOCAL_RPC_URL=http://127.0.0.1:18545" >> "$GITHUB_ENV"
          echo "PROTECTED_EXECUTION_KEY_FILE=${RUNNER_TEMP}/paygod-protected-execution-key.txt" >> "$GITHUB_ENV"

      - name: Start pinned local Anvil
        run: |
          set -euo pipefail
          mkdir -p out/release/local-evm
          anvil \
            --host 127.0.0.1 \
            --port 18545 \
            --chain-id 31337 \
            --silent \
            > out/release/local-evm/anvil.log 2>&1 &
          echo "$!" > out/release/local-evm/anvil.pid

          for i in $(seq 1 30); do
            if cast chain-id --rpc-url "$LOCAL_RPC_URL" >/dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done

          test "$(cast chain-id --rpc-url "$LOCAL_RPC_URL")" = "31337"

      - name: Create protected account and deploy surrogate rail
        run: |
          set -euo pipefail

          for i in $(seq 1 5); do
            printf '0x%s' "$(openssl rand -hex 32)" > "$PROTECTED_EXECUTION_KEY_FILE"
            chmod 600 "$PROTECTED_EXECUTION_KEY_FILE"
            if PROTECTED_ADDR="$(cast wallet address --private-key "$(cat "$PROTECTED_EXECUTION_KEY_FILE")" 2>/dev/null)"; then
              break
            fi
          done
          PROTECTED_ADDR="$(echo "$PROTECTED_ADDR" | tr '[:upper:]' '[:lower:]')"
          echo "PROTECTED_EXECUTION_ACCOUNT=$PROTECTED_ADDR" >> "$GITHUB_ENV"
          printf '%s\n' "$PROTECTED_ADDR" > out/release/local-evm/protected-execution-account.txt

          DEPLOYER="$(curl -fsS -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_accounts","params":[]}' \
            "$LOCAL_RPC_URL" | jq -er '.result[0]' | tr '[:upper:]' '[:lower:]')"

          cast rpc --rpc-url "$LOCAL_RPC_URL" \
            anvil_setBalance "$PROTECTED_ADDR" "0x3635c9adc5dea00000" >/dev/null

          mkdir -p out/release/local-evm/solc
          "$SOLC_BIN" \
            --bin \
            --abi \
            --metadata-hash none \
            --evm-version cancun \
            --overwrite \
            -o out/release/local-evm/solc \
            contracts/ControlledJobRailV0.sol

          BYTECODE="0x$(cat out/release/local-evm/solc/ControlledJobRailV0.bin)"
          cast send \
            --json \
            --unlocked \
            --from "$DEPLOYER" \
            --rpc-url "$LOCAL_RPC_URL" \
            --create "$BYTECODE" \
            "constructor(address)" "$PROTECTED_ADDR" \
            > out/release/local-evm/deploy-receipt.json

          SURROGATE_ADDRESS="$(jq -er '.contractAddress' out/release/local-evm/deploy-receipt.json | tr '[:upper:]' '[:lower:]')"
          echo "SURROGATE_ADDRESS=$SURROGATE_ADDRESS" >> "$GITHUB_ENV"
          printf '%s\n' "$SURROGATE_ADDRESS" > out/release/local-evm/surrogate-address.txt
          cast code "$SURROGATE_ADDRESS" --rpc-url "$LOCAL_RPC_URL" > out/release/local-evm/runtime-code.hex

      - name: Build real local EVM calldata and Transition Envelope
        env:
          PROVIDER_ADDRESS: "0x3333333333333333333333333333333333333333"
          EVALUATOR_ADDRESS: "0x4444444444444444444444444444444444444444"
          HOOK_ADDRESS: "0x0000000000000000000000000000000000000000"
          EXPIRED_AT: "2000000000"
          JOB_DESCRIPTION: "controlled local job v0"
        run: |
          set -euo pipefail
          cast calldata \
            "createJob(address,address,uint256,string,address)" \
            "$PROVIDER_ADDRESS" \
            "$EVALUATOR_ADDRESS" \
            "$EXPIRED_AT" \
            "$JOB_DESCRIPTION" \
            "$HOOK_ADDRESS" \
            > out/release/local-evm/calldata.hex

          node scripts/build-local-evm-transition-v0.mjs \
            --request-shadow out/release/request-shadow.json \
            --execution-account "$PROTECTED_EXECUTION_ACCOUNT" \
            --target "$SURROGATE_ADDRESS" \
            --payload-recipient "$PROVIDER_ADDRESS" \
            --calldata-hex out/release/local-evm/calldata.hex \
            --output out/release/transition-envelope.json \
            --proposal-output out/release/local-evm/transaction-proposal.json

      - name: Start fail-closed R-client proxy
        env:
          RPC_UPSTREAM_URL: "http://127.0.0.1:18545"
          RPC_PROXY_HOST: "0.0.0.0"
          RPC_PROXY_PORT: "18546"
          RPC_PROXY_AUDIT: "out/release/local-evm/r-client-audit.jsonl"
        run: |
          set -euo pipefail
          node scripts/r-client-proxy-v0.mjs             > out/release/local-evm/r-client-proxy.log 2>&1 &
          echo "$!" > out/release/local-evm/r-client-proxy.pid

          for i in $(seq 1 30); do
            if curl -fsS               -H 'content-type: application/json'               --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'               http://127.0.0.1:18546               | jq -e '.result == "0x7a69"' >/dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done

          curl -fsS             -H 'content-type: application/json'             --data '{"jsonrpc":"2.0","id":2,"method":"eth_chainId","params":[]}'             http://127.0.0.1:18546             | jq -e '.result == "0x7a69"' >/dev/null

      - name: Run adversarial C transaction-surface preflight
        env:
          CLIENT_IMAGE: "node@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8"
          JOB_PROVIDER: "0x3333333333333333333333333333333333333333"
          JOB_EVALUATOR: "0x4444444444444444444444444444444444444444"
          JOB_EXPIRED_AT: "2000000000"
          JOB_DESCRIPTION: "controlled local job v0"
          JOB_HOOK: "0x0000000000000000000000000000000000000000"
        run: |
          set -euo pipefail
          mkdir -p out/release/gate-zero-client

          docker pull "$CLIENT_IMAGE" >/dev/null
          CLIENT_REPO_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "$CLIENT_IMAGE")"
          test -n "$CLIENT_REPO_DIGEST"
          case "$CLIENT_REPO_DIGEST" in
            *@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8) ;;
            *) echo "Unexpected client image digest: $CLIENT_REPO_DIGEST"; exit 1 ;;
          esac
          printf '%s\n' "$CLIENT_REPO_DIGEST" > out/release/local-evm/client-container-image.txt

          CALLDATA_HEX="$(tr -d '\n\r ' < out/release/local-evm/calldata.hex)"

          docker run --rm             --add-host=harness-host:host-gateway             --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/gate-zero-e1-client-v0.mjs,dst=/work/gate-zero-e1-client-v0.mjs,readonly"             --mount "type=bind,src=$GITHUB_WORKSPACE/out/release/gate-zero-client,dst=/work/out"             --mount "type=bind,src=$FOUNDRY_DIR/cast,dst=/tools/cast,readonly"             -e R_CLIENT_URL="http://harness-host:18546"             -e R_ADMIN_URL="http://harness-host:18545"             -e TARGET="$SURROGATE_ADDRESS"             -e PROTECTED_EXECUTION_ACCOUNT="$PROTECTED_EXECUTION_ACCOUNT"             -e CALLDATA_HEX="$CALLDATA_HEX"             -e JOB_PROVIDER="$JOB_PROVIDER"             -e JOB_EVALUATOR="$JOB_EVALUATOR"             -e JOB_EXPIRED_AT="$JOB_EXPIRED_AT"             -e JOB_DESCRIPTION="$JOB_DESCRIPTION"             -e JOB_HOOK="$JOB_HOOK"             -e GATE_ZERO_OUTPUT="/work/out/preflight.json"             "$CLIENT_IMAGE"             node /work/gate-zero-e1-client-v0.mjs

          jq -e '
            .result == "NO_BYPASS_OBSERVED_IN_PREFLIGHT" and
            .claim_status == "PREFLIGHT_ONLY_T0_ATTACK_SET_NOT_COMPLETE" and
            .a51_privileged_rpc_rejected == true and
            .a52_r_admin_reachable == false and
            .a53_node_managed_protected_signing_rejected == true and
            .a54_alternate_sender_differs_from_protected == true and
            .a54_alternate_sender != .a54_protected_sender and
            .a54_exact_calldata_observed == true and
            .a54_exact_target_observed == true and
            .a54_protected_consequence_observed == false and
            .next_job_id_before == .next_job_id_after and
            .raw_transaction_submission_available == true and
            .key_reachability.protected_private_key_observed == false and
            .key_reachability.protected_private_key_file_mounted == false and
            .key_reachability.generic_protected_signing_available == false and
            (.key_reachability.forbidden_secret_env_names_present | length) == 0 and
            (.key_reachability.sensitive_paths_reachable | length) == 0 and
            .s0_reachability.authority_state_db_mounted == false and
            .s0_reachability.client_s0_admin_api_exposed == false and
            .s0_reachability.client_s0_reset_path_observed == false and
            (.s0_reachability.forbidden_s0_env_names_present | length) == 0
          ' out/release/gate-zero-client/preflight.json >/dev/null

          node --input-type=module - <<'NODE'
          import fs from 'node:fs';

          const forbidden = new Set([
            'anvil_setBalance',
            'eth_sendTransaction',
            'eth_sign',
            'eth_signTransaction',
            'personal_sign',
          ]);

          const lines = fs
            .readFileSync('out/release/local-evm/r-client-audit.jsonl', 'utf8')
            .trim()
            .split('\n')
            .filter(Boolean)
            .map((line) => JSON.parse(line));

          for (const method of forbidden) {
            const matches = lines.filter((entry) => entry.method === method);
            if (matches.length === 0) {
              throw new Error('Missing R-client audit entry for forbidden method: ' + method);
            }
            if (matches.some((entry) => entry.forwarded !== false)) {
              throw new Error('Forbidden R-client method was forwarded: ' + method);
            }
          }

          const rawForwarded = lines.some(
            (entry) =>
              entry.method === 'eth_sendRawTransaction' &&
              entry.forwarded === true &&
              entry.decision === 'forwarded'
          );
          if (!rawForwarded) {
            throw new Error('Expected eth_sendRawTransaction forwarding was not audited');
          }

          console.log('PASS: R-client audit confirms forbidden methods were not forwarded and raw submission remained available.');
          NODE

      - name: Run frozen T0 S0 replay and concurrency attacks
        run: |
          node scripts/t0-s0-replay-concurrency-v0.mjs \
            --output out/release/gate-zero-client/s0-replay-concurrency.json

          jq -e '
            .a14_concurrent_double_use.result == "REJECTED_AS_EXPECTED" and
            .a14_concurrent_double_use.successful_reservations == 1 and
            .a14_concurrent_double_use.rejected_reservations == 1 and
            .a14_concurrent_double_use.final_state == "TX_RESERVED" and
            .a15_restart_replay.result == "REJECTED_AS_EXPECTED" and
            .a15_restart_replay.observed_code == "S0_STATE_INVALID" and
            .a15_restart_replay.final_state == "TX_RESERVED" and
            .a15_restart_replay.consumed_at_present == true and
            .host_rollback_tested == false and
            .host_rollback_boundary == "DEFERRED_TO_T1"
          ' out/release/gate-zero-client/s0-replay-concurrency.json >/dev/null

      - name: Build controlled Release Candidate
        run: |
          node scripts/build-controlled-release-candidate.mjs             --request-shadow out/release/request-shadow.json             --transition-envelope out/release/transition-envelope.json             --output out/release/release-candidate.json

      - name: Verify exact Release Candidate derivation
        run: |
          node scripts/verify-controlled-release-candidate.mjs \
            --request-shadow out/release/request-shadow.json \
            --transition-envelope out/release/transition-envelope.json \
            --candidate out/release/release-candidate.json

      - name: Checkout pinned PayGod kernel
        uses: actions/checkout@v4
        with:
          repository: hamadalmunyif/paygod-kernel-mvp
          ref: 23ea2cca74ef8b698718c6d0c8dbda447f13bb37
          path: external/paygod-kernel

      - name: Install established receipt-auth backend
        run: python -m pip install -r external/paygod-kernel/tools/requirements-issuer-auth.txt

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Confirm PayGod repository boundary
        working-directory: external/paygod-kernel
        run: python3 tools/check_repository_boundary.py --scan-current

      - name: Publish canonical PayGod CLI
        run: |
          dotnet publish             external/paygod-kernel/src/PayGod.Cli/PayGod.Cli.csproj             -c Release             -o out/paygod-cli

      - name: Canonically hash Release Candidate
        run: |
          dotnet out/paygod-cli/PayGod.Cli.dll validate             --input out/release/release-candidate.json             --json | tee out/release/paygod-validate.json

      - name: Run canonical controlled release decision
        env:
          PAYGOD_CLOCK: "2026-10-07T00:00:00Z"
          PAYGOD_RUNNER_IMAGE: "paygod/controlled-harness"
          PAYGOD_RUNNER_DIGEST: "git:23ea2cca74ef8b698718c6d0c8dbda447f13bb37"
        run: |
          mkdir -p out/release/paygod
          dotnet out/paygod-cli/PayGod.Cli.dll run             --pack packs/controlled-authority-release-v0             --input out/release/release-candidate.json             --out out/release/paygod

      - name: Create isolated controlled decision trust anchor
        env:
          DECISION_PRIVATE_KEY: ${{ runner.temp }}/paygod-controlled-decision-private.pem
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'external/paygod-kernel/tools')
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from issuer_auth import TRUST_PROFILE, ALGORITHM

          private_key = Ed25519PrivateKey.generate()
          public_key = private_key.public_key()
          private_path = Path(os.environ['DECISION_PRIVATE_KEY'])
          private_path.write_bytes(
              private_key.private_bytes(
                  serialization.Encoding.PEM,
                  serialization.PrivateFormat.PKCS8,
                  serialization.NoEncryption(),
              )
          )

          raw_public = public_key.public_bytes(
              serialization.Encoding.Raw,
              serialization.PublicFormat.Raw,
          )
          key_id = 'controlled-decision-ed25519:' + hashlib.sha256(raw_public).hexdigest()
          trust = {
              'profile': TRUST_PROFILE,
              'keys': [{
                  'key_id': key_id,
                  'algorithm': ALGORITHM,
                  'public_key_b64': base64.b64encode(raw_public).decode('ascii'),
              }],
          }
          Path('out/release/decision-trust-store.json').write_text(
              json.dumps(trust, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('out/release/decision-issuer-key-id.txt').write_text(
              key_id + '\n',
              encoding='utf-8',
          )
          PY

      - name: Sign canonical PayGod receipt commitment
        env:
          DECISION_PRIVATE_KEY: ${{ runner.temp }}/paygod-controlled-decision-private.pem
        run: |
          KEY_ID="$(cat out/release/decision-issuer-key-id.txt)"
          python external/paygod-kernel/tools/sign_receipt_commitment.py \
            out/release/paygod \
            --key-id "$KEY_ID" \
            --private-key "$DECISION_PRIVATE_KEY"

      - name: Verify canonical PayGod evidence bundle and issuer authenticity
        run: |
          python3 external/paygod-kernel/tools/verify_portable_evidence.py \
            out/release/paygod \
            --trusted-issuer-keys out/release/decision-trust-store.json \
            --require-issuer-authenticity \
            --result out/release/paygod-verification.json

      - name: Assert canonical release contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const profile = JSON.parse(fs.readFileSync('contracts/controlled-release-profile-v0.json', 'utf8'));
          const validate = JSON.parse(fs.readFileSync('out/release/paygod-validate.json', 'utf8'));
          const receipt = JSON.parse(fs.readFileSync('out/release/paygod/receipt.json', 'utf8'));
          const verified = JSON.parse(fs.readFileSync('out/release/paygod-verification.json', 'utf8'));
          const candidate = JSON.parse(fs.readFileSync('out/release/release-candidate.json', 'utf8'));
          const packBytes = fs.readFileSync(profile.pack.path + '/pack.yaml');
          const packSha = crypto.createHash('sha256').update(packBytes).digest('hex');
          const expectedPackSha = 'ea21e54e165c90418a6d4a903108441fa6d7c0e2c425adc14c0f62a430b9dc7b';

          if (profile.paygodKernelCommit !== '23ea2cca74ef8b698718c6d0c8dbda447f13bb37') {
            throw new Error('Controlled release profile kernel commit drifted');
          }
          if (profile.standaloneVerifierVersion !== verified.verifier_version) {
            throw new Error('Standalone verifier version differs from frozen profile');
          }
          if (profile.pack.digestSha256 !== expectedPackSha) {
            throw new Error('Controlled release profile pack digest differs from pinned workflow digest');
          }
          if (profile.pack.name !== 'controlled-authority-release-v0' || profile.pack.version !== '0.1.0') {
            throw new Error('Controlled release profile pack identity drifted');
          }
          if (profile.pack.allowedVerdict !== 'allow' || profile.pack.allowedRule !== 'controlled-local-release') {
            throw new Error('Controlled release profile verdict contract drifted');
          }
          if (profile.paygodReceiptIssuerAuthenticityRequired !== true) {
            throw new Error('Controlled release profile must require PayGod receipt issuer authenticity');
          }
          if (profile.paygodReceiptSignatureProfile !== 'paygod-ed25519-receipt-v1') {
            throw new Error('Unexpected PayGod receipt signature profile');
          }
          if (profile.paygodReceiptTrustProfile !== 'paygod-ed25519-trust-v1') {
            throw new Error('Unexpected PayGod receipt trust profile');
          }
          if (profile.paygodDecisionIssuerKeyScope !== 'ephemeral-controlled-harness-epoch') {
            throw new Error('Unexpected controlled decision issuer key scope');
          }
          if (profile.paygodDecisionReplayPerformed !== false) {
            throw new Error('Profile unexpectedly claims PayGod decision replay');
          }
          if (validate.status !== 'success') throw new Error('PayGod validate did not succeed');
          if (verified.status !== 'valid' || verified.verification?.integrity !== 'verified') {
            throw new Error('Standalone PayGod verifier did not verify integrity');
          }
          if (verified.verification?.issuer_authenticity !== 'verified') {
            throw new Error('PayGod receipt issuer authenticity was not verified');
          }
          if (verified.issuer_signature?.key_trusted !== true || verified.issuer_signature?.signature_valid !== true) {
            throw new Error('PayGod receipt signature did not verify against the controlled trust anchor');
          }
          if (verified.issuer_signature?.profile !== profile.paygodReceiptSignatureProfile) {
            throw new Error('Verified receipt signature profile differs from frozen profile');
          }
          if (verified.issuer_signature?.algorithm !== 'Ed25519') {
            throw new Error('Verified receipt signature algorithm is not Ed25519');
          }
          if (verified.verification?.replay !== 'not_performed') {
            throw new Error('Unexpected PayGod decision replay state');
          }
          if (receipt.input?.canonical_hash !== validate.data?.hash) {
            throw new Error('Receipt input canonical hash differs from canonical validate hash');
          }
          if (receipt.pack?.name !== profile.pack.name) {
            throw new Error('Unexpected release pack name');
          }
          if (receipt.pack?.version !== profile.pack.version) {
            throw new Error('Unexpected release pack version');
          }
          if (packSha !== expectedPackSha) {
            throw new Error(`Release pack digest drifted from pinned v0 digest: ${packSha}`);
          }
          if (receipt.pack?.digest_sha256 !== expectedPackSha) {
            throw new Error('Receipt pack digest differs from pinned controlled release v0 digest');
          }
          if (receipt.verdict?.value !== profile.pack.allowedVerdict) {
            throw new Error('Expected canonical release verdict allow');
          }
          if (receipt.verdict?.rule_name !== profile.pack.allowedRule) {
            throw new Error('Expected controlled-local-release rule');
          }
          if (
            candidate.request?.admitted_request_identity_sha256 !==
            candidate.transition?.request_identity_sha256
          ) {
            throw new Error('Candidate request/transition identity mismatch');
          }
          if (
            candidate.request?.request_payload_sha256 !==
            candidate.transition?.payload?.payload_sha256
          ) {
            throw new Error('Candidate request/transition payload mismatch');
          }
          if (candidate.transition?.chain_id !== profile.chainId) {
            throw new Error('Release candidate escaped frozen local chain');
          }
          if (candidate.authority?.enforcement_domain !== profile.enforcementDomain) {
            throw new Error('Release candidate escaped frozen enforcement domain');
          }
          if (
            candidate.authority?.external_execution_authorized !==
            profile.externalExecutionAuthorized
          ) {
            throw new Error('Release candidate external execution authority mismatch');
          }

          const summary = {
            status: 'CANONICAL_LOCAL_RELEASE_DECISION_VERIFIED',
            canonicalInputHash: receipt.input.canonical_hash,
            packDigestSha256: packSha,
            verdict: receipt.verdict.value,
            ruleName: receipt.verdict.rule_name,
            integrity: verified.verification.integrity,
            transitionCommitment: candidate.transition.transition_commitment,
            requestIdentity: candidate.request.admitted_request_identity_sha256,
            attemptId: candidate.request.attempt_id,
            attemptCommitmentSha256: candidate.request.attempt_commitment_sha256,
            issuerAuthenticity: verified.verification.issuer_authenticity,
            decisionIssuerKeyId: verified.issuer_signature.key_id,
            decisionIssuerSignatureValid: verified.issuer_signature.signature_valid,
            decisionIssuerKeyTrusted: verified.issuer_signature.key_trusted,
            replay: verified.verification.replay,
            publicOrAcpExecutionPerformed: false
          };
          fs.writeFileSync(
            'out/release/contract-summary.json',
            JSON.stringify(summary, null, 2) + '\n'
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Adversarially verify D-to-I authenticity boundary
        run: |
          set -euo pipefail
          mkdir -p out/release/adversarial

          cp -R out/release/paygod out/release/adversarial/unsigned
          rm -f out/release/adversarial/unsigned/receipt.sig.json
          if python3 external/paygod-kernel/tools/verify_portable_evidence.py \
            out/release/adversarial/unsigned \
            --trusted-issuer-keys out/release/decision-trust-store.json \
            --require-issuer-authenticity \
            --result out/release/adversarial/unsigned-result.json; then
            echo "A44 failed: unsigned receipt was accepted"
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          trust = json.loads(Path('out/release/decision-trust-store.json').read_text())
          trust['keys'] = []
          Path('out/release/adversarial/untrusted-store.json').write_text(
              json.dumps(trust, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

          if python3 external/paygod-kernel/tools/verify_portable_evidence.py \
            out/release/paygod \
            --trusted-issuer-keys out/release/adversarial/untrusted-store.json \
            --require-issuer-authenticity \
            --result out/release/adversarial/untrusted-result.json; then
            echo "A45 failed: untrusted signer was accepted"
            exit 1
          fi

          cp -R out/release/paygod out/release/adversarial/mutated
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('out/release/adversarial/mutated/receipt.json')
          receipt = json.loads(p.read_text())
          receipt['verdict']['rule_name'] = 'mutated-after-signing'
          p.write_text(json.dumps(receipt, separators=(',', ':')), encoding='utf-8')
          PY

          if python3 external/paygod-kernel/tools/verify_portable_evidence.py \
            out/release/adversarial/mutated \
            --trusted-issuer-keys out/release/decision-trust-store.json \
            --require-issuer-authenticity \
            --result out/release/adversarial/mutated-result.json; then
            echo "A46 failed: mutated signed receipt was accepted"
            exit 1
          fi

          echo "PASS: A44-A46 rejected by the established PayGod verifier."

      - name: Create isolated Warrant issuer trust anchor
        env:
          WARRANT_ISSUER_PRIVATE_KEY: ${{ runner.temp }}/paygod-controlled-warrant-issuer-private.pem
        run: |
          node scripts/create-controlled-warrant-issuer-anchor.mjs \
            --private-key-output "$WARRANT_ISSUER_PRIVATE_KEY" \
            --trust-output out/release/warrant-issuer-trust.json

      - name: Issue local Warrant and register S0
        run: |
          node scripts/issue-controlled-warrant-v0.mjs \
            --request-shadow out/release/request-shadow.json \
            --transition-envelope out/release/transition-envelope.json \
            --candidate out/release/release-candidate.json \
            --profile contracts/controlled-release-profile-v0.json \
            --validate out/release/paygod-validate.json \
            --paygod-bundle out/release/paygod \
            --decision-trust-store out/release/decision-trust-store.json \
            --warrant-issuer-private-key "${{ runner.temp }}/paygod-controlled-warrant-issuer-private.pem" \
            --warrant-issuer-trust-store out/release/warrant-issuer-trust.json \
            --state-db out/release/authority-state.db \
            --output-dir out/release/warrant

      - name: Assert local Warrant issuance witness
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const summary = JSON.parse(
            fs.readFileSync('out/release/warrant/issuance-summary.json', 'utf8')
          );
          const warrantTrustBytes = fs.readFileSync(
            'out/release/warrant-issuer-trust.json'
          );
          const warrantTrust = JSON.parse(warrantTrustBytes.toString('utf8'));
          const warrantTrustSha = crypto
            .createHash('sha256')
            .update(warrantTrustBytes)
            .digest('hex');
          if (summary.status !== 'ISSUED') throw new Error('Warrant was not issued');
          if (summary.decisionStatus !== 'AUTHENTICATED_CANONICAL_ALLOW') {
            throw new Error('Warrant did not originate from authenticated canonical allow');
          }
          if (summary.decisionReplay !== 'not_performed') {
            throw new Error('Decision replay boundary changed unexpectedly');
          }
          if (summary.s0State !== 'ISSUED') {
            throw new Error('S0 did not persist ISSUED before Warrant return');
          }
          if (summary.warrantVerification !== 'VALID') {
            throw new Error('Issued Warrant did not independently verify');
          }
          if (summary.warrantIssuerTrustExternallyConfigured !== true) {
            throw new Error('Warrant issuer trust was not externally configured');
          }
          if (summary.warrantIssuerTrustStoreSha256 !== warrantTrustSha) {
            throw new Error('Warrant issuer trust-store digest mismatch');
          }
          if (
            warrantTrust.schema !== 'workflow-observatory/warrant-issuer-trust/v0' ||
            warrantTrust.enforcement_domain !== 'controlled-harness/t0-v0'
          ) {
            throw new Error('Unexpected Warrant issuer trust profile');
          }
          if (
            !Array.isArray(warrantTrust.keys) ||
            warrantTrust.keys.length !== 1 ||
            warrantTrust.keys[0].issuer_key_id !== summary.warrantIssuerKeyId
          ) {
            throw new Error('Issued Warrant key is not the preconfigured trusted issuer');
          }
          if (summary.issuerBridgeRequiredAuthenticity !== true) {
            throw new Error('Issuer bridge did not require decision issuer authenticity');
          }
          if (
            summary.issuerBridgeVerifier !==
            'external/paygod-kernel/tools/verify_portable_evidence.py'
          ) {
            throw new Error('Issuer bridge did not use the pinned PayGod verifier path');
          }
          if (
            summary.e1Executed !== false ||
            summary.e2Executed !== false ||
            summary.evmTransactionSubmitted !== false ||
            summary.acpOrQuiverInteraction !== false
          ) {
            throw new Error('Issuance witness crossed the frozen execution boundary');
          }
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Remove controlled private keys
        if: always()
        run: |
          rm -f "${{ runner.temp }}/paygod-controlled-decision-private.pem"
          rm -f "${{ runner.temp }}/paygod-controlled-warrant-issuer-private.pem"

      - name: Run T0 A9 valid-Warrant payload substitution attack
        run: |
          node scripts/t0-a9-payload-substitution-v0.mjs \
            --warrant-body out/release/warrant/warrant-body.json \
            --warrant-signature out/release/warrant/warrant.sig \
            --warrant-trust-store out/release/warrant-issuer-trust.json \
            --transition-envelope out/release/transition-envelope.json \
            --payload out/release/request-identity.artifacts/request-payload.json \
            --payload-channel controlled-requirement-message/v0 \
            --payload-recipient 0x3333333333333333333333333333333333333333 \
            --payload-content-type requirement \
            --state-db out/release/authority-state.db \
            --output out/release/gate-zero-client/a9-payload-substitution.json

          jq -e '
            .attack == "A9" and
            .result == "REJECTED_AS_EXPECTED" and
            .observed_code == "E2_PAYLOAD_DIGEST_MISMATCH" and
            .valid_warrant_used == true and
            .transition_envelope_unchanged == true and
            .payload_bytes_changed == true and
            .s0_state_after == "ISSUED" and
            .staged_payload_created == false
          ' out/release/gate-zero-client/a9-payload-substitution.json >/dev/null

      - name: Stage exact payload through local E2
        run: |
          node scripts/stage-controlled-payload-v0.mjs \
            --warrant-body out/release/warrant/warrant-body.json \
            --warrant-signature out/release/warrant/warrant.sig \
            --warrant-trust-store out/release/warrant-issuer-trust.json \
            --transition-envelope out/release/transition-envelope.json \
            --payload out/release/request-identity.artifacts/request-payload.json \
            --payload-channel controlled-requirement-message/v0 \
            --payload-recipient 0x3333333333333333333333333333333333333333 \
            --payload-content-type requirement \
            --state-db out/release/authority-state.db \
            --output-dir out/release/e2

      - name: Assert E2 staging only and restart persistence
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { openAuthorityStateStoreV0 } from './src/authority-state-v0.mjs';

          const stage = JSON.parse(
            fs.readFileSync('out/release/e2/e2-stage.json', 'utf8')
          );
          const warrant = JSON.parse(
            fs.readFileSync('out/release/warrant/warrant-body.json', 'utf8')
          );
          const exactPayload = fs.readFileSync(
            'out/release/request-identity.artifacts/request-payload.json'
          );
          const stagedCopy = fs.readFileSync(
            'out/release/e2/staged-payload.bin'
          );

          if (stage.status !== 'PAYLOAD_STAGED' || stage.s0State !== 'PAYLOAD_STAGED') {
            throw new Error('E2 did not stop at PAYLOAD_STAGED');
          }
          if (stage.exactPayloadBytesPersisted !== true) {
            throw new Error('E2 did not preserve exact staged payload bytes');
          }
          if (!exactPayload.equals(stagedCopy)) {
            throw new Error('Persisted staged payload copy differs from frozen request bytes');
          }
          if (
            stage.providerDelivered !== false ||
            stage.e1Executed !== false ||
            stage.evmTransactionSubmitted !== false
          ) {
            throw new Error('E2 staging crossed the frozen consequence boundary');
          }

          const store = await openAuthorityStateStoreV0(
            'out/release/authority-state.db'
          );
          try {
            const row = store.get({
              issuerKeyId: warrant.issuer_key_id,
              nonce: warrant.nonce,
            });
            const persisted = store.getStagedPayload({
              issuerKeyId: warrant.issuer_key_id,
              nonce: warrant.nonce,
            });
            if (row?.state !== 'PAYLOAD_STAGED') {
              throw new Error('S0 restart did not preserve PAYLOAD_STAGED');
            }
            if (!persisted?.payloadBytes?.equals(exactPayload)) {
              throw new Error('S0 restart did not preserve exact staged bytes');
            }
          } finally {
            store.close();
          }

          console.log(JSON.stringify(stage, null, 2));
          NODE

      - name: Probe actual C reachability to host key S0 and trust stores
        env:
          CLIENT_IMAGE: "node@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8"
        run: |
