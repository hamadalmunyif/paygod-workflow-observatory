name: authority-release-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controlled-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout observatory
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run observatory tests
        run: npm test

      - name: Discover and assert frozen decision-pack digests
        run: |
          mkdir -p out/release
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const profile = JSON.parse(
            fs.readFileSync('contracts/controlled-release-profile-v0.json', 'utf8')
          );
          const digest = (path) =>
            crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const actual = {
            admission: digest(profile.admissionPack.path + '/pack.yaml'),
            release: digest(profile.pack.path + '/pack.yaml')
          };
          fs.writeFileSync(
            'out/release/pack-digests.json',
            JSON.stringify(actual, null, 2) + '\n'
          );
          console.log(JSON.stringify(actual, null, 2));
          if (
            profile.admissionPack.digestSha256 !== actual.admission ||
            profile.pack.digestSha256 !== actual.release
          ) {
            throw new Error(
              'DECISION_PACK_DIGESTS_UNPINNED ' +
              'D1=' + actual.admission + ' D2=' + actual.release
            );
          }
          NODE

      - name: Build fixture Observation Pack
        run: |
          node bin/workflow-observatory.mjs discover             --input test/fixtures/browse.json             --query risk             --output-dir out/release/observation-pack

      - name: Freeze admitted fixture Request Identity
        env:
          REQUEST_JSON: '{"company":"Example"}'
          OFFERING_NAME: "Company Risk Analysis"
        run: |
          node scripts/freeze-request-identity.mjs             --raw out/release/observation-pack/raw.json             --normalized out/release/observation-pack/normalized.json             --manifest out/release/observation-pack/manifest.json             --offering "$OFFERING_NAME"             --output out/release/request-identity.json

      - name: Build admitted fixture Request Shadow
        env:
          REQUEST_JSON: '{"company":"Example"}'
          OFFERING_NAME: "Company Risk Analysis"
        run: |
          node scripts/build-shadow-request.mjs             --raw out/release/observation-pack/raw.json             --normalized out/release/observation-pack/normalized.json             --manifest out/release/observation-pack/manifest.json             --request-identity out/release/request-identity.json             --offering "$OFFERING_NAME"             --output out/release/request-shadow.json

      - name: Checkout pinned PayGod kernel
        uses: actions/checkout@v4
        with:
          repository: hamadalmunyif/paygod-kernel-mvp
          ref: 23ea2cca74ef8b698718c6d0c8dbda447f13bb37
          path: external/paygod-kernel

      - name: Install established receipt-auth backend
        run: python -m pip install -r external/paygod-kernel/tools/requirements-issuer-auth.txt

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Confirm PayGod repository boundary
        working-directory: external/paygod-kernel
        run: python3 tools/check_repository_boundary.py --scan-current

      - name: Publish canonical PayGod CLI
        run: |
          dotnet publish             external/paygod-kernel/src/PayGod.Cli/PayGod.Cli.csproj             -c Release             -o out/paygod-cli

      - name: Create isolated controlled decision trust anchor
        env:
          DECISION_PRIVATE_KEY: ${{ runner.temp }}/paygod-controlled-decision-private.pem
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'external/paygod-kernel/tools')
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from issuer_auth import TRUST_PROFILE, ALGORITHM

          private_key = Ed25519PrivateKey.generate()
          public_key = private_key.public_key()
          private_path = Path(os.environ['DECISION_PRIVATE_KEY'])
          private_path.write_bytes(
              private_key.private_bytes(
                  serialization.Encoding.PEM,
                  serialization.PrivateFormat.PKCS8,
                  serialization.NoEncryption(),
              )
          )
          raw_public = public_key.public_bytes(
              serialization.Encoding.Raw,
              serialization.PublicFormat.Raw,
          )
          key_id = 'controlled-decision-ed25519:' + hashlib.sha256(raw_public).hexdigest()
          trust = {
              'profile': TRUST_PROFILE,
              'keys': [{
                  'key_id': key_id,
                  'algorithm': ALGORITHM,
                  'public_key_b64': base64.b64encode(raw_public).decode('ascii'),
              }],
          }
          Path('out/release/decision-trust-store.json').write_text(
              json.dumps(trust, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('out/release/decision-issuer-key-id.txt').write_text(
              key_id + '\n',
              encoding='utf-8',
          )
          PY

      - name: Canonically hash D1 request shadow
        run: |
          dotnet out/paygod-cli/PayGod.Cli.dll validate             --input out/release/request-shadow.json             --json | tee out/release/d1-validate.json

      - name: Run canonical D1 admission decision
        env:
          PAYGOD_CLOCK: "2026-10-07T00:00:00Z"
          PAYGOD_RUNNER_IMAGE: "paygod/controlled-harness-admission"
          PAYGOD_RUNNER_DIGEST: "git:23ea2cca74ef8b698718c6d0c8dbda447f13bb37"
        run: |
          mkdir -p out/release/d1-paygod
          dotnet out/paygod-cli/PayGod.Cli.dll run             --pack packs/acp-request-admission-shadow             --input out/release/request-shadow.json             --out out/release/d1-paygod

      - name: Sign D1 canonical PayGod receipt commitment
        env:
          DECISION_PRIVATE_KEY: ${{ runner.temp }}/paygod-controlled-decision-private.pem
        run: |
          KEY_ID="$(cat out/release/decision-issuer-key-id.txt)"
          python external/paygod-kernel/tools/sign_receipt_commitment.py             out/release/d1-paygod             --key-id "$KEY_ID"             --private-key "$DECISION_PRIVATE_KEY"

      - name: Verify D1 bundle and decision issuer authenticity
        run: |
          python3 external/paygod-kernel/tools/verify_portable_evidence.py             out/release/d1-paygod             --trusted-issuer-keys out/release/decision-trust-store.json             --require-issuer-authenticity             --result out/release/d1-verification.json

      - name: Gate authenticated D1 before D2
        run: |
          node scripts/verify-admission-decision.mjs             --kernel-cli out/paygod-cli/PayGod.Cli.dll             --request-shadow out/release/request-shadow.json             --admission-receipt out/release/d1-paygod/receipt.json             --admission-verification out/release/d1-verification.json             --profile contracts/controlled-release-profile-v0.json             --output out/release/d1-chain-gate.json

      - name: Build local Transition Envelope
        run: |
          node scripts/build-controlled-transition-fixture.mjs             --request-shadow out/release/request-shadow.json             --output out/release/transition-envelope.json

      - name: Build D1-bound controlled Release Candidate
        run: |
          node scripts/build-controlled-release-candidate.mjs             --request-shadow out/release/request-shadow.json             --transition-envelope out/release/transition-envelope.json             --admission-receipt out/release/d1-paygod/receipt.json             --output out/release/release-candidate.json

      - name: Verify exact D1-bound Release Candidate derivation
        run: |
          node scripts/verify-controlled-release-candidate.mjs             --request-shadow out/release/request-shadow.json             --transition-envelope out/release/transition-envelope.json             --admission-receipt out/release/d1-paygod/receipt.json             --candidate out/release/release-candidate.json

      - name: Canonically hash D2 Release Candidate
        run: |
          dotnet out/paygod-cli/PayGod.Cli.dll validate             --input out/release/release-candidate.json             --json | tee out/release/d2-validate.json

      - name: Run canonical D2 controlled release decision
        env:
          PAYGOD_CLOCK: "2026-10-07T00:00:00Z"
          PAYGOD_RUNNER_IMAGE: "paygod/controlled-harness-release"
          PAYGOD_RUNNER_DIGEST: "git:23ea2cca74ef8b698718c6d0c8dbda447f13bb37"
        run: |
          mkdir -p out/release/d2-paygod
          dotnet out/paygod-cli/PayGod.Cli.dll run             --pack packs/controlled-authority-release-v0             --input out/release/release-candidate.json             --out out/release/d2-paygod

      - name: Sign D2 canonical PayGod receipt commitment
        env:
          DECISION_PRIVATE_KEY: ${{ runner.temp }}/paygod-controlled-decision-private.pem
        run: |
          KEY_ID="$(cat out/release/decision-issuer-key-id.txt)"
          python external/paygod-kernel/tools/sign_receipt_commitment.py             out/release/d2-paygod             --key-id "$KEY_ID"             --private-key "$DECISION_PRIVATE_KEY"

      - name: Verify D2 bundle and decision issuer authenticity
        run: |
          python3 external/paygod-kernel/tools/verify_portable_evidence.py             out/release/d2-paygod             --trusted-issuer-keys out/release/decision-trust-store.json             --require-issuer-authenticity             --result out/release/d2-verification.json

      - name: Verify full authenticated D1 to D2 decision chain
        run: |
          node scripts/verify-release-decision-chain.mjs             --kernel-cli out/paygod-cli/PayGod.Cli.dll             --request-shadow out/release/request-shadow.json             --admission-receipt out/release/d1-paygod/receipt.json             --admission-verification out/release/d1-verification.json             --transition-envelope out/release/transition-envelope.json             --release-candidate out/release/release-candidate.json             --release-receipt out/release/d2-paygod/receipt.json             --release-verification out/release/d2-verification.json             --profile contracts/controlled-release-profile-v0.json             --output out/release/decision-chain.json

      - name: Assert authenticated decision-chain claim boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const chain = JSON.parse(fs.readFileSync('out/release/decision-chain.json', 'utf8'));
          if (chain.status !== 'DECISION_CHAIN_VERIFIED') throw new Error('Decision chain did not verify');
          if (chain.d1.verdict !== 'allow' || chain.d1.rule !== 'shadow-admitted') {
            throw new Error('Unexpected D1 decision');
          }
          if (chain.d2.verdict !== 'allow' || chain.d2.rule !== 'controlled-local-release') {
            throw new Error('Unexpected D2 decision');
          }
          if (chain.d1.issuerAuthenticity !== 'verified' ||
              chain.d2.issuerAuthenticity !== 'verified') {
            throw new Error('D1/D2 issuer authenticity not verified');
          }
          if (chain.d1.decisionIssuerKeyId !== chain.d2.decisionIssuerKeyId) {
            throw new Error('D1/D2 decision issuer epoch mismatch');
          }
          if (chain.d1.replay !== 'not_performed' ||
              chain.d2.replay !== 'not_performed') {
            throw new Error('Unexpected decision replay claim');
          }
          if (chain.externalExecutionAuthorized !== false) {
            throw new Error('Decision chain upgraded external execution authority');
          }
          console.log(JSON.stringify({
            status: chain.status,
            decisionIssuerKeyId: chain.d1.decisionIssuerKeyId,
            d1ReceiptSha256: chain.d1.receiptSha256,
            d2ReceiptSha256: chain.d2.receiptSha256,
            requestIdentity: chain.requestIdentity,
            attemptId: chain.attemptId,
            transitionCommitment: chain.transitionCommitment,
            issuerAuthenticity: 'verified',
            replay: 'not_performed',
            warrantIssued: false,
            s0RegisteredFromDecision: false,
            evmTransactionSubmitted: false,
            publicOrAcpExecutionPerformed: false
          }, null, 2));
          NODE

      - name: Remove controlled decision private key
        if: always()
        run: rm -f "${{ runner.temp }}/paygod-controlled-decision-private.pem"

      - name: Upload authenticated local decision-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-release-contract-${{ github.run_id }}
          path: out/release
          retention-days: 7
          if-no-files-found: error
