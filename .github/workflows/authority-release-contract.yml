name: authority-release-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controlled-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout observatory
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run observatory tests
        run: npm test

      - name: Build fixture Observation Pack
        run: |
          node bin/workflow-observatory.mjs discover             --input test/fixtures/browse.json             --query risk             --output-dir out/release/observation-pack

      - name: Freeze admitted fixture Request Identity
        env:
          REQUEST_JSON: '{"company":"Example"}'
          OFFERING_NAME: "Company Risk Analysis"
        run: |
          node scripts/freeze-request-identity.mjs             --raw out/release/observation-pack/raw.json             --normalized out/release/observation-pack/normalized.json             --manifest out/release/observation-pack/manifest.json             --offering "$OFFERING_NAME"             --output out/release/request-identity.json

      - name: Build admitted fixture Request Shadow
        env:
          REQUEST_JSON: '{"company":"Example"}'
          OFFERING_NAME: "Company Risk Analysis"
        run: |
          node scripts/build-shadow-request.mjs             --raw out/release/observation-pack/raw.json             --normalized out/release/observation-pack/normalized.json             --manifest out/release/observation-pack/manifest.json             --request-identity out/release/request-identity.json             --offering "$OFFERING_NAME"             --output out/release/request-shadow.json

      - name: Build local Transition Envelope
        run: |
          node scripts/build-controlled-transition-fixture.mjs             --request-shadow out/release/request-shadow.json             --output out/release/transition-envelope.json

      - name: Build controlled Release Candidate
        run: |
          node scripts/build-controlled-release-candidate.mjs             --request-shadow out/release/request-shadow.json             --transition-envelope out/release/transition-envelope.json             --output out/release/release-candidate.json

      - name: Verify exact Release Candidate derivation
        run: |
          node scripts/verify-controlled-release-candidate.mjs \
            --request-shadow out/release/request-shadow.json \
            --transition-envelope out/release/transition-envelope.json \
            --candidate out/release/release-candidate.json

      - name: Checkout pinned PayGod kernel
        uses: actions/checkout@v4
        with:
          repository: hamadalmunyif/paygod-kernel-mvp
          ref: 23ea2cca74ef8b698718c6d0c8dbda447f13bb37
          path: external/paygod-kernel

      - name: Install established receipt-auth backend
        run: python -m pip install -r external/paygod-kernel/tools/requirements-issuer-auth.txt

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Confirm PayGod repository boundary
        working-directory: external/paygod-kernel
        run: python3 tools/check_repository_boundary.py --scan-current

      - name: Publish canonical PayGod CLI
        run: |
          dotnet publish             external/paygod-kernel/src/PayGod.Cli/PayGod.Cli.csproj             -c Release             -o out/paygod-cli

      - name: Canonically hash Release Candidate
        run: |
          dotnet out/paygod-cli/PayGod.Cli.dll validate             --input out/release/release-candidate.json             --json | tee out/release/paygod-validate.json

      - name: Run canonical controlled release decision
        env:
          PAYGOD_CLOCK: "2026-10-07T00:00:00Z"
          PAYGOD_RUNNER_IMAGE: "paygod/controlled-harness"
          PAYGOD_RUNNER_DIGEST: "git:23ea2cca74ef8b698718c6d0c8dbda447f13bb37"
        run: |
          mkdir -p out/release/paygod
          dotnet out/paygod-cli/PayGod.Cli.dll run             --pack packs/controlled-authority-release-v0             --input out/release/release-candidate.json             --out out/release/paygod

      - name: Create isolated controlled decision trust anchor
        env:
          DECISION_PRIVATE_KEY: ${{ runner.temp }}/paygod-controlled-decision-private.pem
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, 'external/paygod-kernel/tools')
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from issuer_auth import TRUST_PROFILE, ALGORITHM

          private_key = Ed25519PrivateKey.generate()
          public_key = private_key.public_key()
          private_path = Path(os.environ['DECISION_PRIVATE_KEY'])
          private_path.write_bytes(
              private_key.private_bytes(
                  serialization.Encoding.PEM,
                  serialization.PrivateFormat.PKCS8,
                  serialization.NoEncryption(),
              )
          )

          raw_public = public_key.public_bytes(
              serialization.Encoding.Raw,
              serialization.PublicFormat.Raw,
          )
          key_id = 'controlled-decision-ed25519:' + hashlib.sha256(raw_public).hexdigest()
          trust = {
              'profile': TRUST_PROFILE,
              'keys': [{
                  'key_id': key_id,
                  'algorithm': ALGORITHM,
                  'public_key_b64': base64.b64encode(raw_public).decode('ascii'),
              }],
          }
          Path('out/release/decision-trust-store.json').write_text(
              json.dumps(trust, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('out/release/decision-issuer-key-id.txt').write_text(
              key_id + '\n',
              encoding='utf-8',
          )
          PY

      - name: Sign canonical PayGod receipt commitment
        env:
          DECISION_PRIVATE_KEY: ${{ runner.temp }}/paygod-controlled-decision-private.pem
        run: |
          KEY_ID="$(cat out/release/decision-issuer-key-id.txt)"
          python external/paygod-kernel/tools/sign_receipt_commitment.py \
            out/release/paygod \
            --key-id "$KEY_ID" \
            --private-key "$DECISION_PRIVATE_KEY"

      - name: Verify canonical PayGod evidence bundle and issuer authenticity
        run: |
          python3 external/paygod-kernel/tools/verify_portable_evidence.py \
            out/release/paygod \
            --trusted-issuer-keys out/release/decision-trust-store.json \
            --require-issuer-authenticity \
            --result out/release/paygod-verification.json

      - name: Assert canonical release contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const profile = JSON.parse(fs.readFileSync('contracts/controlled-release-profile-v0.json', 'utf8'));
          const validate = JSON.parse(fs.readFileSync('out/release/paygod-validate.json', 'utf8'));
          const receipt = JSON.parse(fs.readFileSync('out/release/paygod/receipt.json', 'utf8'));
          const verified = JSON.parse(fs.readFileSync('out/release/paygod-verification.json', 'utf8'));
          const candidate = JSON.parse(fs.readFileSync('out/release/release-candidate.json', 'utf8'));
          const packBytes = fs.readFileSync(profile.pack.path + '/pack.yaml');
          const packSha = crypto.createHash('sha256').update(packBytes).digest('hex');
          const expectedPackSha = 'ea21e54e165c90418a6d4a903108441fa6d7c0e2c425adc14c0f62a430b9dc7b';

          if (profile.paygodKernelCommit !== '23ea2cca74ef8b698718c6d0c8dbda447f13bb37') {
            throw new Error('Controlled release profile kernel commit drifted');
          }
          if (profile.standaloneVerifierVersion !== verified.verifier_version) {
            throw new Error('Standalone verifier version differs from frozen profile');
          }
          if (profile.pack.digestSha256 !== expectedPackSha) {
            throw new Error('Controlled release profile pack digest differs from pinned workflow digest');
          }
          if (profile.pack.name !== 'controlled-authority-release-v0' || profile.pack.version !== '0.1.0') {
            throw new Error('Controlled release profile pack identity drifted');
          }
          if (profile.pack.allowedVerdict !== 'allow' || profile.pack.allowedRule !== 'controlled-local-release') {
            throw new Error('Controlled release profile verdict contract drifted');
          }
          if (profile.paygodReceiptIssuerAuthenticityRequired !== true) {
            throw new Error('Controlled release profile must require PayGod receipt issuer authenticity');
          }
          if (profile.paygodReceiptSignatureProfile !== 'paygod-ed25519-receipt-v1') {
            throw new Error('Unexpected PayGod receipt signature profile');
          }
          if (profile.paygodReceiptTrustProfile !== 'paygod-ed25519-trust-v1') {
            throw new Error('Unexpected PayGod receipt trust profile');
          }
          if (profile.paygodDecisionIssuerKeyScope !== 'ephemeral-controlled-harness-epoch') {
            throw new Error('Unexpected controlled decision issuer key scope');
          }
          if (profile.paygodDecisionReplayPerformed !== false) {
            throw new Error('Profile unexpectedly claims PayGod decision replay');
          }
          if (validate.status !== 'success') throw new Error('PayGod validate did not succeed');
          if (verified.status !== 'valid' || verified.verification?.integrity !== 'verified') {
            throw new Error('Standalone PayGod verifier did not verify integrity');
          }
          if (verified.verification?.issuer_authenticity !== 'verified') {
            throw new Error('PayGod receipt issuer authenticity was not verified');
          }
          if (verified.issuer_signature?.key_trusted !== true || verified.issuer_signature?.signature_valid !== true) {
            throw new Error('PayGod receipt signature did not verify against the controlled trust anchor');
          }
          if (verified.issuer_signature?.profile !== profile.paygodReceiptSignatureProfile) {
            throw new Error('Verified receipt signature profile differs from frozen profile');
          }
          if (verified.issuer_signature?.algorithm !== 'Ed25519') {
            throw new Error('Verified receipt signature algorithm is not Ed25519');
          }
          if (verified.verification?.replay !== 'not_performed') {
            throw new Error('Unexpected PayGod decision replay state');
          }
          if (receipt.input?.canonical_hash !== validate.data?.hash) {
            throw new Error('Receipt input canonical hash differs from canonical validate hash');
          }
          if (receipt.pack?.name !== profile.pack.name) {
            throw new Error('Unexpected release pack name');
          }
          if (receipt.pack?.version !== profile.pack.version) {
            throw new Error('Unexpected release pack version');
          }
          if (packSha !== expectedPackSha) {
            throw new Error(`Release pack digest drifted from pinned v0 digest: ${packSha}`);
          }
          if (receipt.pack?.digest_sha256 !== expectedPackSha) {
            throw new Error('Receipt pack digest differs from pinned controlled release v0 digest');
          }
          if (receipt.verdict?.value !== profile.pack.allowedVerdict) {
            throw new Error('Expected canonical release verdict allow');
          }
          if (receipt.verdict?.rule_name !== profile.pack.allowedRule) {
            throw new Error('Expected controlled-local-release rule');
          }
          if (
            candidate.request?.admitted_request_identity_sha256 !==
            candidate.transition?.request_identity_sha256
          ) {
            throw new Error('Candidate request/transition identity mismatch');
          }
          if (
            candidate.request?.request_payload_sha256 !==
            candidate.transition?.payload?.payload_sha256
          ) {
            throw new Error('Candidate request/transition payload mismatch');
          }
          if (candidate.transition?.chain_id !== profile.chainId) {
            throw new Error('Release candidate escaped frozen local chain');
          }
          if (candidate.authority?.enforcement_domain !== profile.enforcementDomain) {
            throw new Error('Release candidate escaped frozen enforcement domain');
          }
          if (
            candidate.authority?.external_execution_authorized !==
            profile.externalExecutionAuthorized
          ) {
            throw new Error('Release candidate external execution authority mismatch');
          }

          const summary = {
            status: 'CANONICAL_LOCAL_RELEASE_DECISION_VERIFIED',
            canonicalInputHash: receipt.input.canonical_hash,
            packDigestSha256: packSha,
            verdict: receipt.verdict.value,
            ruleName: receipt.verdict.rule_name,
            integrity: verified.verification.integrity,
            transitionCommitment: candidate.transition.transition_commitment,
            requestIdentity: candidate.request.admitted_request_identity_sha256,
            attemptId: candidate.request.attempt_id,
            attemptCommitmentSha256: candidate.request.attempt_commitment_sha256,
            issuerAuthenticity: verified.verification.issuer_authenticity,
            decisionIssuerKeyId: verified.issuer_signature.key_id,
            decisionIssuerSignatureValid: verified.issuer_signature.signature_valid,
            decisionIssuerKeyTrusted: verified.issuer_signature.key_trusted,
            replay: verified.verification.replay,
            publicOrAcpExecutionPerformed: false
          };
          fs.writeFileSync(
            'out/release/contract-summary.json',
            JSON.stringify(summary, null, 2) + '\n'
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Remove controlled decision private key
        if: always()
        run: rm -f "${{ runner.temp }}/paygod-controlled-decision-private.pem"

      - name: Upload local release contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-release-contract-${{ github.run_id }}
          path: out/release
          retention-days: 7
          if-no-files-found: error
