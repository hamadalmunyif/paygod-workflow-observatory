      - name: Remove protected execution key and stop local rail
        if: always()
        run: |
          rm -f "$PROTECTED_EXECUTION_KEY_FILE"
          if [ -f out/release/local-evm/r-client-proxy.pid ]; then
            kill "$(cat out/release/local-evm/r-client-proxy.pid)" 2>/dev/null || true
          fi
          if [ -f out/release/local-evm/anvil.pid ]; then
            kill "$(cat out/release/local-evm/anvil.pid)" 2>/dev/null || true
          fi

      - name: Upload local release contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-release-contract-${{ github.run_id }}
          path: out/release
          retention-days: 7
          if-no-files-found: error
