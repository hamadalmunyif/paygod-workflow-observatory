            frozen_attack_manifest: 'docs/GATE_ZERO_T0_ATTACK_MANIFEST_V0.md',
            tools: {
              client_image: fs
                .readFileSync(
                  'out/release/local-evm/client-container-image.txt',
                  'utf8'
                )
                .trim(),
              foundry_archive_sha256:
                '6c66ffcc55fa4249197721baa3098bc208014ea1d8aa04b2ed50ac6bccffb226',
              solc_sha256:
                'f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7',
              chain_id: 31337,
            },
            attacks: {
              A51: attack(
                'REJECTED_AS_EXPECTED',
                'REJECTED_AS_EXPECTED',
                'C_BOUNDARY_RUNTIME_PASS',
                preflightPath
              ),
              A52: attack(
                'REJECTED_AS_EXPECTED',
                'REJECTED_AS_EXPECTED',
                'C_BOUNDARY_RUNTIME_PASS',
                preflightPath
              ),
              A53_A1: attack(
                'REJECTED_AS_EXPECTED',
                'REJECTED_AS_EXPECTED',
                'C_BOUNDARY_RUNTIME_PASS',
                preflightPath
              ),
              A54_A2_A17: attack(
                'REJECTED_AS_EXPECTED',
                'REJECTED_AS_EXPECTED',
                'C_BOUNDARY_RUNTIME_PASS',
                preflightPath
              ),
              KEY_REACHABILITY: attack(
                'REJECTED_AS_EXPECTED',
                'REJECTED_AS_EXPECTED',
                'C_BOUNDARY_RUNTIME_PASS',
                boundaryPath
              ),
              S0_REACHABILITY_A16: attack(
                'REJECTED_AS_EXPECTED',
                'REJECTED_AS_EXPECTED',
                'C_BOUNDARY_RUNTIME_PASS',
