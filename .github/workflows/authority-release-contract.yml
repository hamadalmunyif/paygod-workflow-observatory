name: authority-release-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controlled-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout observatory
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run observatory tests
        run: npm test

      - name: Build fixture Observation Pack
        run: |
          node bin/workflow-observatory.mjs discover             --input test/fixtures/browse.json             --query risk             --output-dir out/release/observation-pack

      - name: Freeze admitted fixture Request Identity
        env:
          REQUEST_JSON: '{"company":"Example"}'
          OFFERING_NAME: "Company Risk Analysis"
        run: |
          node scripts/freeze-request-identity.mjs             --raw out/release/observation-pack/raw.json             --normalized out/release/observation-pack/normalized.json             --manifest out/release/observation-pack/manifest.json             --offering "$OFFERING_NAME"             --output out/release/request-identity.json

      - name: Build admitted fixture Request Shadow
        env:
          REQUEST_JSON: '{"company":"Example"}'
          OFFERING_NAME: "Company Risk Analysis"
        run: |
          node scripts/build-shadow-request.mjs             --raw out/release/observation-pack/raw.json             --normalized out/release/observation-pack/normalized.json             --manifest out/release/observation-pack/manifest.json             --request-identity out/release/request-identity.json             --offering "$OFFERING_NAME"             --output out/release/request-shadow.json

      - name: Build local Transition Envelope
        run: |
          node scripts/build-controlled-transition-fixture.mjs             --request-shadow out/release/request-shadow.json             --output out/release/transition-envelope.json

      - name: Build controlled Release Candidate
        run: |
          node scripts/build-controlled-release-candidate.mjs             --request-shadow out/release/request-shadow.json             --transition-envelope out/release/transition-envelope.json             --output out/release/release-candidate.json

      - name: Verify exact Release Candidate derivation
        run: |
          node scripts/verify-controlled-release-candidate.mjs \
            --request-shadow out/release/request-shadow.json \
            --transition-envelope out/release/transition-envelope.json \
            --candidate out/release/release-candidate.json

      - name: Checkout pinned PayGod kernel
        uses: actions/checkout@v4
        with:
          repository: hamadalmunyif/paygod-kernel-mvp
          ref: 23ea2cca74ef8b698718c6d0c8dbda447f13bb37
          path: external/paygod-kernel

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Confirm PayGod repository boundary
        working-directory: external/paygod-kernel
        run: python3 tools/check_repository_boundary.py --scan-current

      - name: Publish canonical PayGod CLI
        run: |
          dotnet publish             external/paygod-kernel/src/PayGod.Cli/PayGod.Cli.csproj             -c Release             -o out/paygod-cli

      - name: Canonically hash Release Candidate
        run: |
          dotnet out/paygod-cli/PayGod.Cli.dll validate             --input out/release/release-candidate.json             --json | tee out/release/paygod-validate.json

      - name: Run canonical controlled release decision
        env:
          PAYGOD_CLOCK: "2026-10-07T00:00:00Z"
          PAYGOD_RUNNER_IMAGE: "paygod/controlled-harness"
          PAYGOD_RUNNER_DIGEST: "git:23ea2cca74ef8b698718c6d0c8dbda447f13bb37"
        run: |
          mkdir -p out/release/paygod
          dotnet out/paygod-cli/PayGod.Cli.dll run             --pack packs/controlled-authority-release-v0             --input out/release/release-candidate.json             --out out/release/paygod

      - name: Verify canonical PayGod evidence bundle
        run: |
          python3 external/paygod-kernel/tools/verify_portable_evidence.py             out/release/paygod             --result out/release/paygod-verification.json

      - name: Assert canonical release contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const validate = JSON.parse(fs.readFileSync('out/release/paygod-validate.json', 'utf8'));
          const receipt = JSON.parse(fs.readFileSync('out/release/paygod/receipt.json', 'utf8'));
          const verified = JSON.parse(fs.readFileSync('out/release/paygod-verification.json', 'utf8'));
          const candidate = JSON.parse(fs.readFileSync('out/release/release-candidate.json', 'utf8'));
          const packBytes = fs.readFileSync('packs/controlled-authority-release-v0/pack.yaml');
          const packSha = crypto.createHash('sha256').update(packBytes).digest('hex');
          const expectedPackSha = 'e4b94e20b6f93e899e9e93eaf2a9844c74483e1abbea88d13dbdc5033eabbca9';

          if (validate.status !== 'success') throw new Error('PayGod validate did not succeed');
          if (verified.status !== 'valid' || verified.verification?.integrity !== 'verified') {
            throw new Error('Standalone PayGod verifier did not verify integrity');
          }
          if (receipt.input?.canonical_hash !== validate.data?.hash) {
            throw new Error('Receipt input canonical hash differs from canonical validate hash');
          }
          if (receipt.pack?.name !== 'controlled-authority-release-v0') {
            throw new Error('Unexpected release pack name');
          }
          if (receipt.pack?.version !== '0.1.0') {
            throw new Error('Unexpected release pack version');
          }
          if (packSha !== expectedPackSha) {
            throw new Error(`Release pack digest drifted from pinned v0 digest: ${packSha}`);
          }
          if (receipt.pack?.digest_sha256 !== expectedPackSha) {
            throw new Error('Receipt pack digest differs from pinned controlled release v0 digest');
          }
          if (receipt.verdict?.value !== 'allow') {
            throw new Error('Expected canonical release verdict allow');
          }
          if (receipt.verdict?.rule_name !== 'controlled-local-release') {
            throw new Error('Expected controlled-local-release rule');
          }
          if (
            candidate.request?.admitted_request_identity_sha256 !==
            candidate.transition?.request_identity_sha256
          ) {
            throw new Error('Candidate request/transition identity mismatch');
          }
          if (
            candidate.request?.request_payload_sha256 !==
            candidate.transition?.payload?.payload_sha256
          ) {
            throw new Error('Candidate request/transition payload mismatch');
          }
          if (candidate.transition?.chain_id !== 31337) {
            throw new Error('Release candidate escaped local chain 31337');
          }
          if (candidate.authority?.external_execution_authorized !== false) {
            throw new Error('Release candidate claims external execution authority');
          }

          const summary = {
            status: 'CANONICAL_LOCAL_RELEASE_DECISION_VERIFIED',
            canonicalInputHash: receipt.input.canonical_hash,
            packDigestSha256: packSha,
            verdict: receipt.verdict.value,
            ruleName: receipt.verdict.rule_name,
            integrity: verified.verification.integrity,
            transitionCommitment: candidate.transition.transition_commitment,
            requestIdentity: candidate.request.admitted_request_identity_sha256,
            publicOrAcpExecutionPerformed: false
          };
          fs.writeFileSync(
            'out/release/contract-summary.json',
            JSON.stringify(summary, null, 2) + '\n'
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload local release contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-release-contract-${{ github.run_id }}
          path: out/release
          retention-days: 7
          if-no-files-found: error
