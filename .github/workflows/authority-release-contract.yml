      - name: Assert E1 local execution stops at TX_EXECUTED
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { openAuthorityStateStoreV0 } from './src/authority-state-v0.mjs';

          const e1 = JSON.parse(
            fs.readFileSync('out/release/e1/e1-execution.json', 'utf8')
          );
          const warrant = JSON.parse(
            fs.readFileSync('out/release/warrant/warrant-body.json', 'utf8')
          );
          const protectedAddress = fs
            .readFileSync('out/release/local-evm/protected-execution-account.txt', 'utf8')
            .trim();

          if (e1.status !== 'TX_EXECUTED' || e1.s0State !== 'TX_EXECUTED') {
            throw new Error('E1 did not stop at TX_EXECUTED');
          }
          if (e1.protectedExecutionAccount !== protectedAddress) {
            throw new Error('E1 execution account differs from frozen protected account');
          }
          if (
            e1.signatureReturnedToCaller !== false ||
            e1.operationalMetadataSuppliedByCaller !== false ||
            e1.providerDelivered !== false ||
            e1.payloadReleased !== false ||
            e1.acpOrQuiverInteraction !== false
          ) {
            throw new Error('E1 local execution crossed the frozen slice boundary');
          }

          const store = await openAuthorityStateStoreV0(
            'out/release/authority-state.db'
          );
          try {
            const row = store.get({
              issuerKeyId: warrant.issuer_key_id,
              nonce: warrant.nonce,
            });
            if (row?.state !== 'TX_EXECUTED') {
              throw new Error('S0 restart did not preserve TX_EXECUTED');
            }
            if (!row.txEvidenceSha256) {
              throw new Error('S0 did not bind transaction evidence digest');
            }
          } finally {
            store.close();
          }

          console.log(JSON.stringify(e1, null, 2));
          NODE

      - name: Record bounded T0 E1 Gate Zero witness
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const readJson = (p) => JSON.parse(fs.readFileSync(p, 'utf8'));
          const sha256File = (p) =>
            crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');

          const preflightPath = 'out/release/gate-zero-client/preflight.json';
          const boundaryPath = 'out/release/gate-zero-client/client-boundary.json';
          const s0Path = 'out/release/gate-zero-client/s0-replay-concurrency.json';
          const a9Path = 'out/release/gate-zero-client/a9-payload-substitution.json';
          const e1Path = 'out/release/e1/e1-execution.json';
          const tapPath = 'out/release/gate-zero-client/supporting-tests.tap';

          const preflight = readJson(preflightPath);
          const boundary = readJson(boundaryPath);
          const s0 = readJson(s0Path);
          const a9 = readJson(a9Path);
          const e1 = readJson(e1Path);
          const tap = fs.readFileSync(tapPath, 'utf8');

          const supportingNames = [
            'second reservation is rejected after TX_RESERVED consumption',
            'A43 staged payload cannot be replaced or staged twice',
            'A55 caller operational metadata is rejected',
            'A5 untrusted Warrant issuer is rejected',
            'external trust store rejects key id that does not match SPKI bytes',
          ];
          for (const name of supportingNames) {
            if (!tap.includes(name)) {
              throw new Error('Missing supporting T0 test evidence: ' + name);
            }
          }

          const required = [
            preflight.a51_privileged_rpc_rejected === true,
            preflight.a52_r_admin_reachable === false,
            preflight.a53_node_managed_protected_signing_rejected === true,
            preflight.a54_alternate_sender_differs_from_protected === true,
            preflight.a54_protected_consequence_observed === false,
            preflight.raw_transaction_submission_available === true,
            boundary.result === 'NO_CLIENT_SECRET_OR_S0_REACHABILITY_OBSERVED',
            boundary.protected_key_host_path_readable === false,
            boundary.protected_key_host_path_writable === false,
            boundary.s0_host_path_readable === false,
            boundary.s0_host_path_writable === false,
            boundary.decision_trust_store_readable === false,
            boundary.decision_trust_store_writable === false,
            boundary.warrant_trust_store_readable === false,
            boundary.warrant_trust_store_writable === false,
            boundary.docker_socket_readable === false,
            boundary.docker_socket_writable === false,
            Array.isArray(boundary.suspicious_secret_env_names) &&
              boundary.suspicious_secret_env_names.length === 0,
            s0.a14_concurrent_double_use?.result === 'REJECTED_AS_EXPECTED',
            s0.a14_concurrent_double_use?.successful_reservations === 1,
            s0.a14_concurrent_double_use?.rejected_reservations === 1,
            s0.a15_restart_replay?.result === 'REJECTED_AS_EXPECTED',
            a9.result === 'REJECTED_AS_EXPECTED',
            a9.observed_code === 'E2_PAYLOAD_DIGEST_MISMATCH',
            a9.s0_state_after === 'ISSUED',
            e1.status === 'TX_EXECUTED',
            e1.signatureReturnedToCaller === false,
          ];
          if (required.some((value) => value !== true)) {
            throw new Error('T0 E1 witness prerequisites are incomplete');
          }

          const attack = (expected, observed, evidenceClass, evidencePath) => ({
            expected,
            observed,
            evidence_class: evidenceClass,
            evidence_path: evidencePath,
            evidence_sha256: sha256File(evidencePath),
