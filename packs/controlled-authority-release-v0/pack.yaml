api_version: "paygod/v1"
kind: Pack
metadata:
  name: "controlled-authority-release-v0"
  version: "0.2.0"
  description: "Local-only controlled harness D2 release decision bound to an exact D1 admission receipt. It does not authorize ACP or public-chain execution."
  maintainer: "internal"
  tags: ["controlled-harness", "release", "local-only", "decision-chain"]

spec:
  policy:
    rules:
      - name: "deny-wrong-kind"
        condition: "input.kind != 'paygod-controlled-release-candidate'"
        decision: "deny"
        reason: "Release candidate kind is not the frozen controlled-harness kind."

      - name: "deny-wrong-profile"
        condition: "input.profile != 'controlled-harness/release-candidate/v0'"
        decision: "deny"
        reason: "Release candidate profile is not v0."

      - name: "deny-admission-link-missing"
        condition: "not input.admission.receipt_sha256 or not input.admission.input_canonical_hash or not input.admission.pack_digest_sha256"
        decision: "deny"
        reason: "D2 requires an exact D1 receipt commitment and canonical-input binding."

      - name: "deny-admission-contract-mismatch"
        condition: "input.admission.pack_name != 'acp-request-admission-shadow' or input.admission.pack_version != '0.2.0' or input.admission.verdict != 'allow' or input.admission.rule != 'shadow-admitted'"
        decision: "deny"
        reason: "D2 requires the frozen D1 shadow-admission result. D1 remains non-executable by itself."

      - name: "deny-request-not-admitted"
        condition: "input.request.status != 'CANDIDATE_LOCAL_VALIDATED' or input.request.schema_validation != 'LOCAL_VALIDATED' or not input.request.admitted_request_identity_sha256"
        decision: "deny"
        reason: "Request is not locally admitted under the frozen request-identity path."

      - name: "deny-attempt-not-bound"
        condition: "not input.request.attempt_id or not input.request.attempt_commitment_sha256"
        decision: "deny"
        reason: "Release decision requires an explicit frozen request-attempt binding."

      - name: "deny-request-transition-mismatch"
        condition: "input.request.admitted_request_identity_sha256 != input.transition.request_identity_sha256"
        decision: "deny"
        reason: "Transition is not bound to the admitted request identity."

      - name: "deny-request-payload-mismatch"
        condition: "input.request.request_payload_sha256 != input.transition.payload.payload_sha256"
        decision: "deny"
        reason: "Transition payload is not the exact frozen request payload."

      - name: "deny-nonlocal-system"
        condition: "input.transition.system != 'evm' or input.transition.chain_id != 31337"
        decision: "deny"
        reason: "Controlled release v0 is restricted to the local EVM harness chain."

      - name: "deny-wrong-domain"
        condition: "input.authority.enforcement_domain != 'controlled-harness/t0-v0'"
        decision: "deny"
        reason: "Enforcement domain is outside the frozen controlled harness."

      - name: "deny-external-authority"
        condition: "input.authority.local_only != true or input.authority.external_execution_authorized != false"
        decision: "deny"
        reason: "Controlled release v0 must remain local-only with external execution unauthorized."

      - name: "deny-incomplete-transition"
        condition: "not input.transition.transition_commitment or not input.transition.execution_account or not input.transition.target or not input.transition.calldata_sha256 or not input.transition.payload.recipient or not input.transition.payload.payload_sha256"
        decision: "deny"
        reason: "Transition commitment or one of the declared enforcement-surface bindings is missing."

      - name: "controlled-local-release"
        condition: "input.admission.receipt_sha256 and input.admission.input_canonical_hash and input.admission.pack_digest_sha256 and input.admission.pack_name == 'acp-request-admission-shadow' and input.admission.pack_version == '0.2.0' and input.admission.verdict == 'allow' and input.admission.rule == 'shadow-admitted' and input.request.status == 'CANDIDATE_LOCAL_VALIDATED' and input.request.schema_validation == 'LOCAL_VALIDATED' and input.request.attempt_id and input.request.attempt_commitment_sha256 and input.request.admitted_request_identity_sha256 == input.transition.request_identity_sha256 and input.request.request_payload_sha256 == input.transition.payload.payload_sha256 and input.transition.system == 'evm' and input.transition.chain_id == 31337 and input.authority.enforcement_domain == 'controlled-harness/t0-v0' and input.authority.local_only == true and input.authority.external_execution_authorized == false"
        decision: "allow"
        reason: "D2 local transition is eligible for decision-chain verification within T0. Warrant issuance still requires verified D1+D2 linkage."
