api_version: "paygod/v1"
kind: Pack
metadata:
  name: "acp-request-admission-shadow"
  version: "0.2.0"
  description: "Internal shadow-only admission probe for an ACP request candidate. It never authorizes ACP execution."
  maintainer: "internal"
  tags: ["acp", "shadow", "request", "admission"]

spec:
  policy:
    rules:
      - name: "descriptor-missing"
        condition: "input.workflow.descriptorPresent == false"
        decision: "deny"
        reason: "Requested ACP offering was not observed in the captured descriptor set."

      - name: "payload-missing"
        condition: "input.request.payloadPresent == false"
        decision: "flag"
        reason: "Workflow descriptor exists, but no request payload has been admitted."

      - name: "schema-local-rejected"
        condition: "input.request.schemaValidation == 'LOCAL_REJECTED'"
        decision: "deny"
        reason: "Request candidate failed local validation against the observed ACP requirement schema."

      - name: "schema-not-validated"
        condition: "input.request.schemaValidation != 'LOCAL_VALIDATED'"
        decision: "flag"
        reason: "Request payload exists but has not been locally validated against the observed requirement schema."

      - name: "shadow-admitted"
        condition: "input.request.schemaValidation == 'LOCAL_VALIDATED'"
        decision: "allow"
        reason: "Request candidate passed local shadow admission. ACP execution remains unauthorized."
